<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sydney Candidate Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#map{background:#171717}
    .controls{position:fixed;z-index:1000;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid #3f3f46;border-radius:999px;background:rgba(15,15,16,.94);box-shadow:0 8px 30px rgba(0,0,0,.35)}
    .controls button{border:0;border-radius:999px;background:transparent;color:#d4d4d8;padding:9px 14px;font-weight:750;cursor:pointer}.controls button.active{background:#f4f4f5;color:#18181b}.count{position:fixed;z-index:1000;left:12px;bottom:12px;padding:9px 12px;border-radius:9px;background:rgba(15,15,16,.94);color:#f4f4f5;font-size:13px}
    .back{position:fixed;z-index:1000;left:12px;top:14px;padding:9px 12px;border-radius:9px;background:rgba(15,15,16,.94);color:#f4f4f5;text-decoration:none}.leaflet-popup-content{line-height:1.45}.leaflet-popup-content h3{margin:0 0 6px}.leaflet-popup-content p{margin:4px 0}@media(max-width:600px){.back{top:auto;bottom:12px}.controls{top:10px;width:max-content;max-width:calc(100% - 16px)}.controls button{padding:9px 11px}.count{bottom:56px}}
    </style></head><body><a class="back" href="../">← Hub</a><div class="controls" role="group" aria-label="Filter events"><button type="button" data-filter="all" class="active">All</button><button type="button" data-filter="weekday_mon_fri">Weekday</button><button type="button" data-filter="weekend">Weekend</button></div><div id="map"></div><div class="count" aria-live="polite">Loading events…</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
    const map=L.map('map').setView([-33.8688,151.2093],11);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);
    const layer=L.layerGroup().addTo(map);let events=[];let filter='all';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function occurrenceDate(value){const text=String(value||'');if(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(text)){const [year,month,day]=text.split('-').map(Number);return new Date(year,month-1,day)}return new Date(text)}
    function whenText(row){return (row.occurrences||[]).slice(0,4).map(o=>occurrenceDate(o.starts_at).toLocaleString(undefined,{dateStyle:'medium',timeStyle:String(o.starts_at).includes('T')?'short':undefined})).join('<br>')}
    function render(){layer.clearLayers();const shown=events.filter(row=>filter==='all'||(row.memberships||[]).includes(filter));for(const row of shown){const both=(row.memberships||[]).length>1;const colour=both?'#a855f7':(row.memberships||[]).includes('weekend')?'#f97316':'#3b82f6';const popup=`<h3>${esc(row.title)}</h3><p>${esc(row.venue||row.area||'Sydney')}</p><p>${whenText(row)}</p><p><strong>${esc(row.price||'Check site')}</strong></p>${row.url?`<p><a href="${esc(row.url)}" target="_blank" rel="noopener">Event details</a></p>`:''}${row.approximate?'<p><small>City-wide location; exact pin unavailable.</small></p>':''}`;let marker;if(row.approximate){marker=L.circle([row.latitude,row.longitude],{radius:Math.max(1000,Number(row.radius_km||1)*1000),color:colour,fillColor:colour,fillOpacity:.08,weight:2})}else{marker=L.circleMarker([row.latitude,row.longitude],{radius:8,color:'#fff',weight:1,fillColor:colour,fillOpacity:.92})}marker.bindPopup(popup).addTo(layer)}document.querySelector('.count').textContent=`${shown.length} event${shown.length===1?'':'s'}`;if(shown.length){const bounds=L.latLngBounds(shown.map(row=>[row.latitude,row.longitude]));if(bounds.isValid())map.fitBounds(bounds,{padding:[45,45],maxZoom:14})}}
    document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item===button));render()}));fetch('events.json').then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}).then(payload=>{events=payload.events||[];render()}).catch(error=>{document.querySelector('.count').textContent=`Map data unavailable: ${error.message}`});
    </script></body></html>
