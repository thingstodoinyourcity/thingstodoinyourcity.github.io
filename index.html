<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Things To Do In Your City</title><style>
    *{box-sizing:border-box}body{margin:0;background:#0f0f10;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .wrap{width:min(760px,calc(100% - 32px));margin:0 auto;padding:48px 0 72px}h1{margin:0 0 10px;font-size:clamp(32px,7vw,52px);letter-spacing:-.04em}
    .tagline{margin:0 0 38px;color:#a1a1aa;line-height:1.55}.section-title{margin:34px 0 14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#a1a1aa}
    .cards{display:grid;gap:12px}.card{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px;border:1px solid #2b2b30;border-radius:14px;background:#19191c}
    .card h2{margin:0 0 5px;font-size:18px}.card p{margin:0;color:#a1a1aa;font-size:14px;line-height:1.45}.button{flex:none;padding:11px 16px;border-radius:9px;background:#ff6b35;color:white;text-decoration:none;font-weight:750}
    .map-card{border-color:#164e63}.map-card .button{background:#38bdf8;color:#082f49}.manual{margin-top:38px;padding:22px;border:1px solid #2b2b30;border-radius:14px;background:#151518}
    .manual code{display:block;margin-top:8px;padding:10px;border-radius:8px;background:#0c0c0e;color:#d4d4d8;overflow-wrap:anywhere;user-select:all}.small{color:#71717a;font-size:12px;margin-top:28px}
    @media(max-width:560px){.wrap{padding-top:28px}.card{align-items:flex-start;flex-direction:column}.button{width:100%;text-align:center}}
    </style></head><body><main class="wrap"><h1>Things To Do In Your City</h1><p class="tagline">Live city event maps and calendar subscriptions.</p><div class="cards"><div class="card"><div><h2>London This Week</h2><p>Candidate map and subscribable event calendars.</p></div><a class="button" href="london-events-hub/">Open</a></div><div class="card"><div><h2>Sydney This Week</h2><p>Candidate map and subscribable event calendars.</p></div><a class="button" href="sydney-events-hub/">Open</a></div></div></main></body></html>
