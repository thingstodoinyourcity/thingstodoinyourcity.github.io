<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Things To Do In Your City — Calendars &amp; Maps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 48px 24px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #FF6B35;
    }
    .tagline {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 48px;
      line-height: 1.5;
    }
    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #FF6B35;
    }
    .calendars {
      display: grid;
      gap: 12px;
      margin-bottom: 48px;
    }
    .cal-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .cal-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .cal-info p  { font-size: 0.85rem; color: rgba(255,255,255,0.5); line-height: 1.4; }
    .subscribe-btn {
      display: inline-block;
      background: #FF6B35;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .subscribe-btn:hover { background: #e55a24; }
    .map-card {
      background: #1a1a1a;
      border: 1px solid #1e3a4a;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 48px;
    }
    .map-card h2 { margin-bottom: 8px; color: #38bdf8; }
    .map-card .desc {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .map-btn {
      display: inline-block;
      background: #38bdf8;
      color: #0f0f0f;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    .map-btn:hover { background: #7dd3fc; }
    .map-btn-secondary {
      background: transparent;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }
    .map-btn-secondary:hover { background: rgba(56,189,248,0.1); color: #7dd3fc; border-color: #7dd3fc; }
    .map-note {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
      margin-top: 12px;
      line-height: 1.5;
    }
    .how-to {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 28px 28px;
      margin-bottom: 48px;
    }
    .how-to h2 { margin-bottom: 24px; }
    .steps { display: flex; flex-direction: column; gap: 20px; }
    .step { display: flex; gap: 16px; align-items: flex-start; }
    .step-num {
      background: #FF6B35;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .step-text h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .step-text p  { font-size: 0.85rem; color: rgba(255,255,255,0.55); line-height: 1.5; }
    .clients {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 28px;
    }
    .client {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 16px;
    }
    .client h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    .client p  { font-size: 0.8rem; color: rgba(255,255,255,0.5); line-height: 1.4; }
    .manual-sub {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 48px;
    }
    .manual-sub h2 { margin-bottom: 8px; }
    .manual-sub .intro { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 20px; line-height: 1.5; }
    .url-list { display: flex; flex-direction: column; gap: 12px; }
    .url-row { display: flex; flex-direction: column; gap: 4px; }
    .url-label { font-size: 0.8rem; font-weight: 600; color: rgba(255,255,255,0.7); }
    .url-copy {
      font-family: monospace;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.55);
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 8px 12px;
      word-break: break-all;
      user-select: all;
      cursor: text;
    }
    .url-copy:hover { color: rgba(255,255,255,0.8); border-color: #444; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Things To Do In Your City</h1>
    <p class="tagline">City event calendars and maps, generated from the shared weekly events pipeline.</p>
    <h2>Available Cities</h2>
    <div class="calendars">
      <div class="cal-card">
        <div class="cal-info">
          <h3>London This Week</h3>
          <p>Calendar and map feeds for this city.</p>
        </div>
        <a class="subscribe-btn" href="london-events-hub/">Open</a>
      </div>
      <div class="cal-card">
        <div class="cal-info">
          <h3>Sydney This Week</h3>
          <p>Calendar and map feeds for this city.</p>
        </div>
        <a class="subscribe-btn" href="sydney-events-hub/">Open</a>
      </div>
    </div>
  </div>
</body>
</html>
